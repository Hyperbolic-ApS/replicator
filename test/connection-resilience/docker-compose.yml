version: '3.8'

services:
  source-esdb:
    container_name: test-source-esdb
    image: eventstore/eventstore:23.10.1-bookworm-slim
    platform: linux/amd64
    ports:
      - '2114:2113'
      - '11113:1113'
    environment:
      EVENTSTORE_CLUSTER_SIZE: 1
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
      EVENTSTORE_EXT_TCP_PORT: 1113
      EVENTSTORE_HTTP_PORT: 2113
      EVENTSTORE_ENABLE_EXTERNAL_TCP: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  sink-eventstore:
    container_name: test-sink-eventstore
    image: eventstore/eventstore:23.10.1-bookworm-slim
    platform: linux/amd64
    ports:
      - '2113:2113'
      - '1113:1113'
    environment:
      EVENTSTORE_CLUSTER_SIZE: 1
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
      EVENTSTORE_RUN_PROJECTIONS: All
      EVENTSTORE_START_STANDARD_PROJECTIONS: "true"
      EVENTSTORE_EXT_TCP_PORT: 1113
      EVENTSTORE_HTTP_PORT: 2113
      EVENTSTORE_ENABLE_EXTERNAL_TCP: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  mock-transform:
    container_name: test-mock-transform
    build:
      context: ./mock-transform
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: ${PORT:-3000}
      FAILURE_MODE: ${FAILURE_MODE:-none}
      FAILURE_RATE: ${FAILURE_RATE:-0.0}
      DELAY_MS: ${DELAY_MS:-0}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  toxiproxy:
    container_name: test-toxiproxy
    image: ghcr.io/shopify/toxiproxy:latest
    ports:
      - '8474:8474'
      - '11131:11131'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8474/version"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  default:
    name: test-repl-network
